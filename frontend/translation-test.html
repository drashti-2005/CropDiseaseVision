<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropDiseaseVision - Translation Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f7fa;
        }
        .test-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #27ae60;
        }
        .test-item {
            margin: 15px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fafafa;
        }
        .test-label {
            font-weight: bold;
            color: #2c3e50;
        }
        .test-result {
            margin-top: 8px;
            padding: 8px;
            background: #e8f5e9;
            border-left: 4px solid #27ae60;
            border-radius: 2px;
        }
        .error {
            background: #ffebee !important;
            border-left-color: #e74c3c !important;
            color: #c62828;
        }
        select, input {
            padding: 8px;
            margin: 10px 0;
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background: #27ae60;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px 0;
        }
        button:hover {
            background: #1e8449;
        }
        .loader {
            display: none;
            margin: 10px 0;
        }
        .loader.active {
            display: inline;
            color: #f39c12;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🌾 CropDiseaseVision - Translation Test</h1>
        
        <div class="test-item">
            <div class="test-label">Select Language</div>
            <select id="languageSelector">
                <option value="English">English</option>
                <option value="Hindi">हिन्दी</option>
                <option value="Gujarati">ગુજરાતી</option>
                <option value="Marathi">मराठी</option>
                <option value="Tamil">தமிழ்</option>
                <option value="Telugu">తెలుగు</option>
            </select>
        </div>

        <div class="test-item">
            <div class="test-label">Test Translation</div>
            <input type="text" id="testText" placeholder="Enter text to translate..." value="Tomato Late Blight">
            <button onclick="testTranslation()">Translate</button>
            <div class="loader" id="loader"><i class="fas fa-spinner fa-spin"></i> Translating...</div>
            <div class="test-result" id="translationResult" style="display: none;"></div>
        </div>

        <div class="test-item">
            <div class="test-label">Test Speech Recognition Language</div>
            <button onclick="testSpeechLang()">Current Language Code</button>
            <div class="test-result" id="speechResult" style="display: none;"></div>
        </div>

        <div class="test-item">
            <div class="test-label">Test Text-to-Speech</div>
            <input type="text" id="speechText" placeholder="Enter text to speak..." value="Disease detected in your crop">
            <button onclick="testSpeech()">Speak</button>
            <button onclick="stopSpeech()" style="background: #e74c3c;">Stop</button>
        </div>

        <div class="test-item">
            <div class="test-label">Translation Cache Status</div>
            <button onclick="showCacheStatus()">Show Cache</button>
            <div class="test-result" id="cacheStatus" style="display: none; white-space: pre-wrap; font-family: monospace; font-size: 12px;"></div>
        </div>

        <div class="test-item">
            <div class="test-label">API Health Check</div>
            <button onclick="checkBackend()">Check Backend</button>
            <div class="test-result" id="backendStatus" style="display: none;"></div>
        </div>
    </div>

    <script>
        // Language Configuration (matching script.js)
        const LANGUAGE_MAP = {
            'English': 'en',
            'Hindi': 'hi',
            'Gujarati': 'gu',
            'Marathi': 'mr',
            'Tamil': 'ta',
            'Telugu': 'te'
        };

        const VOICE_LANG_MAP = {
            'English': 'en-US',
            'Hindi': 'hi-IN',
            'Gujarati': 'gu-IN',
            'Marathi': 'mr-IN',
            'Tamil': 'ta-IN',
            'Telugu': 'te-IN'
        };

        let currentLanguage = 'English';
        let translationCache = {};

        // Initialize
        const langSelector = document.getElementById('languageSelector');
        const savedLang = localStorage.getItem('selectedLanguage');
        if (savedLang) {
            currentLanguage = savedLang;
            langSelector.value = currentLanguage;
        }

        langSelector.addEventListener('change', (e) => {
            currentLanguage = e.target.value;
            localStorage.setItem('selectedLanguage', currentLanguage);
            console.log(`Language changed to: ${currentLanguage}`);
        });

        // Test Translation
        async function testTranslation() {
            const text = document.getElementById('testText').value || 'Tomato Late Blight';
            const resultDiv = document.getElementById('translationResult');
            const loader = document.getElementById('loader');

            loader.classList.add('active');
            resultDiv.style.display = 'none';

            try {
                const translated = await translateText(text, currentLanguage);
                
                resultDiv.innerHTML = `
                    <strong>Original:</strong> ${text}<br>
                    <strong>Language:</strong> ${currentLanguage}<br>
                    <strong>Translated:</strong> ${translated}
                `;
                resultDiv.style.display = 'block';
                resultDiv.classList.remove('error');
                console.log(`✓ Translation successful`);
            } catch (error) {
                resultDiv.innerHTML = `<strong>Error:</strong> ${error.message}`;
                resultDiv.classList.add('error');
                resultDiv.style.display = 'block';
                console.error('✗ Translation failed:', error);
            } finally {
                loader.classList.remove('active');
            }
        }

        // Test Speech Language
        function testSpeechLang() {
            const voiceCode = VOICE_LANG_MAP[currentLanguage];
            const langCode = LANGUAGE_MAP[currentLanguage];
            const resultDiv = document.getElementById('speechResult');

            resultDiv.innerHTML = `
                <strong>Current Language:</strong> ${currentLanguage}<br>
                <strong>Voice Code:</strong> ${voiceCode}<br>
                <strong>Translation Code:</strong> ${langCode}
            `;
            resultDiv.style.display = 'block';
        }

        // Test Speech
        async function testSpeech() {
            const text = document.getElementById('speechText').value || 'Disease detected';
            const voiceCode = VOICE_LANG_MAP[currentLanguage];

            try {
                let speechText = text;
                
                // Translate if not English
                if (currentLanguage !== 'English') {
                    speechText = await translateText(text, currentLanguage);
                }

                const utterance = new SpeechSynthesisUtterance(speechText);
                utterance.lang = voiceCode;
                utterance.rate = 0.9;
                utterance.pitch = 1.0;

                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
                
                console.log(`✓ Speaking in ${currentLanguage}: ${speechText}`);
            } catch (error) {
                console.error('✗ Speech error:', error);
            }
        }

        function stopSpeech() {
            window.speechSynthesis.cancel();
            console.log('Speech stopped');
        }

        // Show Cache
        function showCacheStatus() {
            const resultDiv = document.getElementById('cacheStatus');
            const cacheKeys = Object.keys(translationCache);
            
            if (cacheKeys.length === 0) {
                resultDiv.innerHTML = 'Cache is empty. Make a translation first.';
            } else {
                let cacheHtml = `Cache Size: ${cacheKeys.length}\n\n`;
                cacheKeys.forEach(key => {
                    cacheHtml += `Key: ${key}\n`;
                    cacheHtml += `Value: ${translationCache[key]}\n\n`;
                });
                resultDiv.innerHTML = cacheHtml;
            }
            resultDiv.style.display = 'block';
        }

        // Check Backend
        async function checkBackend() {
            const resultDiv = document.getElementById('backendStatus');
            
            try {
                const response = await fetch('http://127.0.0.1:5000/health');
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <strong>Backend Status:</strong> ✓ Connected<br>
                    <strong>API Response:</strong><br>
                    ${JSON.stringify(data, null, 2)}
                `;
                resultDiv.classList.remove('error');
                resultDiv.style.display = 'block';
                console.log('✓ Backend connected');
            } catch (error) {
                resultDiv.innerHTML = `
                    <strong>Backend Status:</strong> ✗ Not Connected<br>
                    <strong>Error:</strong> ${error.message}<br>
                    <strong>Make sure backend is running at:</strong> http://127.0.0.1:5000
                `;
                resultDiv.classList.add('error');
                resultDiv.style.display = 'block';
                console.error('✗ Backend not connected:', error);
            }
        }

        // Translation Function (matching script.js)
        async function translateText(text, targetLanguage = currentLanguage) {
            if (!text || targetLanguage === 'English') {
                return text;
            }

            const cacheKey = `${text}__${targetLanguage}`;
            if (translationCache[cacheKey]) {
                console.log(`[Cache Hit] ${text.substring(0, 30)}...`);
                return translationCache[cacheKey];
            }

            try {
                const targetCode = LANGUAGE_MAP[targetLanguage];
                if (!targetCode) return text;

                console.log(`[Translating] ${text.substring(0, 30)}... to ${targetLanguage}`);
                
                const response = await fetch('https://libretranslate.de/translate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        q: text,
                        source: 'en',
                        target: targetCode,
                        format: 'text'
                    })
                });

                if (!response.ok) {
                    throw new Error(`Translation API error: ${response.status}`);
                }

                const data = await response.json();
                const translatedText = data.translatedText || text;
                
                translationCache[cacheKey] = translatedText;
                console.log(`[Translated] ${translatedText}`);
                
                return translatedText;
            } catch (error) {
                console.error(`Translation error for "${text}":`, error);
                return text;
            }
        }

        // Auto-check backend on load
        window.addEventListener('load', () => {
            console.log('🌾 CropDiseaseVision Translation Test Page Loaded');
            console.log('Current Language:', currentLanguage);
        });
    </script>
</body>
</html>
